[package]
name = "smiles_fp"
version = "0.2.1"
edition = "2024"
description = "Rust-accelerated Tanimoto similarity search over RDKit Morgan fingerprints."

[lib]
crate-type = ["cdylib"]
name = "_smiles_fp"

[dependencies]
cxx = "1.0"
memmap2 = "0.9"
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.8"

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
