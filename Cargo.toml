[package]
name = "smiles_fp"
version = "0.2.1"
edition = "2024"
description = "Rust-accelerated Tanimoto similarity search over RDKit Morgan fingerprints."

[lib]
name = "_smiles_fp"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
rayon = "1.8"
cxx = "1.0"
memmap2 = "0.9"

[build-dependencies]
cxx-build = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
debug = false
opt-level = 3
panic = "abort"
strip = true
