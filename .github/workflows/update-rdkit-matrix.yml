name: Update RDKit matrix
on:
  schedule:
    # run 2h after rdkit-headers-pypi cron jobs runs
    - cron: "0 8 * * 1"
  workflow_dispatch:
jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      triples: ${{ steps.diff.outputs.triples }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - id: diff
        run: |
          triples="$(uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py missing-matrix)"
          echo "triples=$triples" >> "$GITHUB_OUTPUT"
  build:
    needs: diff
    if: needs.diff.outputs.triples != '[]'
    runs-on: ${{ matrix.triple.os }}
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.diff.outputs.triples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.triple.python-version }}
      - name: Build wheel for RDKit ${{ matrix.triple.rdkit_version }} / Python ${{ matrix.triple.python-version }}
        run: |
          uv run --no-project --with maturin --with requests --with packaging --with tomli \
            --with doctyper --with auditwheel --with patchelf \
            python3 smiles-fp-pypi/build_wheel.py ${{ matrix.triple.rdkit_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.triple.os }}-${{ matrix.triple.rdkit_version }}-${{ matrix.triple.python-version }}
          path: target/wheels
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
  # release.yml's own matrix job computes the same build set live from PyPI, so nothing needs
  # to be recorded back into it here.
  bump-dev-pin:
    needs: diff
    if: always() && needs.diff.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Bump the canonical dev/CI RDKit pin to the newest overall release
        run: |
          uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py bump-pin
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git diff --staged --quiet || git commit -m "Bump dev/CI RDKit pin to the newest release"
          git push
