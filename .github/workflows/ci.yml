name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Derive RDKIT_VERSION from pyproject.toml
        run: echo "RDKIT_VERSION=$(python3 smiles-fp-pypi/dev_rdkit_version.py)" >> "$GITHUB_ENV"
      - run: uv sync --group dev
      # add mypy to path
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.0
  matrix:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.matrix.outputs.pairs }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - id: matrix
        run: |
          pairs="$(uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py ci-matrix)"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
  tests:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.matrix.outputs.pairs) }}
    env:
      PYTHON_VERSION: ${{ matrix.pair.python-version }}
      RDKIT_VERSION: ${{ matrix.pair.rdkit_version }}
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.pair.python-version }}
      - run: uv sync --group dev --python ${{ matrix.pair.python-version }}
      - run: uv pip install "rdkit==$RDKIT_VERSION"
      - run: uv run --no-sync coverage run -m pytest --benchmark-skip
      - run: uv run --no-sync coverage combine || true
      - run: uv run --no-sync coverage report
