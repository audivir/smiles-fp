name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    env:
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Derive RDKIT_VERSION from pyproject.toml
        run: echo "RDKIT_VERSION=$(python3 smiles-fp-pypi/dev_rdkit_version.py)" >> "$GITHUB_ENV"
      - run: uv sync --group dev
      # add mypy to path
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.0
  matrix:
    runs-on: ubuntu-latest
    outputs:
      triples: ${{ steps.matrix.outputs.triples }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - id: matrix
        run: |
          triples="$(uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py ci-matrix)"
          echo "triples=$triples" >> "$GITHUB_OUTPUT"
  tests:
    needs: matrix
    runs-on: ${{ matrix.triple.os }}
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.matrix.outputs.triples) }}
    env:
      RDKIT_VERSION: ${{ matrix.triple.rdkit_version }}
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.triple.python-version }}
      - name: Pin rdkit to the matrix version before uv sync
        run: |
          sed -i.bak -E 's/rdkit==[0-9.]+/rdkit==${{ matrix.triple.rdkit_version }}/' pyproject.toml
          rm -f pyproject.toml.bak
      - run: uv sync --group dev
      - run: uv run coverage run -m pytest --benchmark-skip
      - run: uv run coverage combine || true
      - run: uv run coverage report
