name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the base Cargo.toml version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  matrix:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      rdkit_versions: ${{ steps.matrix.outputs.rdkit_versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - id: matrix
        # RDKit versions to build wheels for: the union of the current latest-per-series RDKit
        # releases and any RDKit versions that already have a published smiles-fp wheel for the
        # current Cargo.toml version. See smiles-fp-pypi/update_rdkit_matrix.py.
        run: |
          rdkit_versions="$(uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py release-matrix)"
          echo "rdkit_versions=$rdkit_versions" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        rdkit_version: ${{ fromJson(needs.matrix.outputs.rdkit_versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build wheels for RDKit ${{ matrix.rdkit_version }}
        run: |
          uv run --no-project --with maturin --with requests --with packaging --with tomli \
            --with doctyper --with auditwheel --with patchelf \
            python3 smiles-fp-pypi/build_wheels.py ${{ matrix.rdkit_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.rdkit_version }}
          path: target/wheels
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
