name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the base Cargo.toml version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  matrix:
    needs: check-version
    runs-on: ubuntu-latest
    outputs:
      triples: ${{ steps.matrix.outputs.triples }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - id: matrix
        # (python-version, rdkit_version, os) triples without an already-published wheel, so a
        # rerun after a partial failure only rebuilds what's still missing. See
        # smiles-fp-pypi/update_rdkit_matrix.py.
        run: |
          triples="$(uv run --no-project --with requests --with packaging --with tomli --with doctyper python3 smiles-fp-pypi/update_rdkit_matrix.py missing-matrix)"
          echo "triples=$triples" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    if: needs.matrix.outputs.triples != '[]'
    runs-on: ${{ matrix.triple.os }}
    strategy:
      fail-fast: false
      matrix:
        triple: ${{ fromJson(needs.matrix.outputs.triples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.triple.python-version }}
      - name: Build wheel for RDKit ${{ matrix.triple.rdkit_version }} / Python ${{ matrix.triple.python-version }}
        run: |
          uv run --no-project --with maturin --with requests --with packaging --with tomli \
            --with doctyper --with auditwheel --with patchelf \
            python3 smiles-fp-pypi/build_wheel.py ${{ matrix.triple.rdkit_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.triple.os }}-${{ matrix.triple.rdkit_version }}-${{ matrix.triple.python-version }}
          path: target/wheels
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
